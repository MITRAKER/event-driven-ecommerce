# Dependabot opens small weekly update PRs. The commit-message prefixes make their titles
# Conventional Commits (e.g. "build(deps): bump pg from 8.13.1 to 8.14.0"), so they pass
# the PR-title check and land in the right CHANGELOG section. Runtime dependencies and the
# base image use build, which makes a release. Development tools use chore(deps-dev) and
# GitHub Actions use ci: they never ship in an image, so they don't make a release.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      prefix-development: chore
      include: scope
    # One PR for runtime dependencies and one for tooling, instead of one PR per package.
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development
    ignore:
      # Until ts-jest and typescript-eslint support TypeScript 7 (their peer ranges stop below 7).
      - dependency-name: typescript
        versions: ['>=7']
      # @types/node majors follow the Node.js runtime (.nvmrc, Dockerfile), which we upgrade on purpose.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # Until Jest supports Babel 8. Jest 30 runs on Babel 7, and the Babel 8 versions of the
      # plugins in jest.preset.js need @babel/core 8, so npm can't install both (ERESOLVE).
      - dependency-name: '@babel/*'
        update-types: ['version-update:semver-major']
      - dependency-name: babel-plugin-transform-import-meta
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope

  # The node:26-alpine base image in the Dockerfile.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
