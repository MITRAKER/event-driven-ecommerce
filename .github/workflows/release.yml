# Continuous delivery, driven by Conventional Commits.
#
# 1. Every push to main runs release-please. It keeps one "release PR" open
#    (e.g. "chore(main): release 0.2.0") that bumps the version in package.json and adds the
#    new CHANGELOG.md entries, worked out from the commit messages since the last release.
# 2. Merging that PR makes release-please tag the commit vX.Y.Z and create a GitHub Release.
# 3. The publish job then builds one image per service and pushes it to GitHub Container Registry.
#
# Why is publishing in this workflow instead of a separate one triggered `on: release`?
# A release created with the default GITHUB_TOKEN does not trigger other workflows (GitHub's
# guard against endless loops), so a separate workflow would never start.
name: Release

on:
  push:
    branches: [main]

# Nothing by default; each job asks for exactly what it needs (least privilege).
permissions: {}

# Never run two releases at once, and never cancel one halfway through a publish.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR / tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the tag and the GitHub Release, push the release branch
      pull-requests: write # open and update the release PR
      issues: write # create the "autorelease: pending" labels it puts on the release PR
    # For the root package ("."), the action exposes these outputs at the top level.
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish ${{ matrix.service }} image
    needs: release-please
    # Outputs are strings, so compare with 'true'. On an ordinary push this job is skipped.
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # push to ghcr.io
    strategy:
      fail-fast: false
      matrix:
        service: [order-service, inventory-service, payment-service, order-query-service]
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image names on GHCR must be lowercase, but the owner name may not be (MITRAKER).
      - name: Compute the image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          SERVICE: ${{ matrix.service }}
        run: echo "name=ghcr.io/${OWNER,,}/event-driven-ecommerce-${SERVICE}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: SERVICE=${{ matrix.service }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ env.VERSION }}
            ${{ steps.image.outputs.name }}:latest
          # The source label links the package to this repository on GitHub.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}

      # No image vulnerability scan here, on purpose. The usual tool, aquasecurity/trivy-action,
      # had 76 of its 77 version tags force-pushed to malicious commits in March 2026: every
      # workflow that used it by tag ran code that stole CI secrets. Version tags can be moved;
      # a full commit SHA cannot. If you add a scanner, pin it to a commit SHA you have checked.
      # Meanwhile: npm audit (CI), Dependabot (npm packages, actions, base image) and CodeQL.
