name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm test

  e2e:
    name: End-to-end (Kafka + Postgres + all services)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: docker compose up -d --build
      - run: node tests/e2e/e2e.mjs
      - name: Service logs
        if: always()
        run: docker compose logs --no-color order-service inventory-service payment-service order-query-service
      - run: docker compose down -v
        if: always()
