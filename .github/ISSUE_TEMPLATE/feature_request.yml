name: Feature request
description: Suggest a new feature, pattern or lesson.
title: 'feat: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. This is a learning project, so suggestions that teach a new pattern or explain an existing one better are especially welcome.
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What problem would this solve, or what would it teach? Why does it matter?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How could it work? Which services, events or endpoints would change?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, and why you prefer this one.
  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to work on it?
      options:
        - Yes, I'd like to open a pull request
        - Maybe, with some guidance
        - No
    validations:
      required: true
