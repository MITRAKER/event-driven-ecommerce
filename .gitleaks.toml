# gitleaks configuration: scan with all of gitleaks' built-in rules, plus one narrow exception.
# https://github.com/gitleaks/gitleaks#configuration

title = "event-driven-ecommerce"

[extend]
# Keep every default rule (API keys, tokens, private keys, ...).
useDefault = true

[allowlist]
description = "Throwaway local-dev Postgres credentials: user and password are both 'shop'"
# Only a finding whose matched text is one of these dev credentials is dropped, such as
# postgres://shop:shop@localhost:5432/orders in docker-compose.yml, the services' package.json
# start scripts and the docs. "match" compares the regexes with what a rule matched, not with
# the whole line ("line"), so a real secret next to these credentials is still reported.
regexTarget = "match"
regexes = [
  '''postgres(ql)?://shop:shop@''',
  '''POSTGRES_PASSWORD:\s*shop\b''',
]
