# Infra only:   docker compose up -d redpanda redpanda-console postgres
# Everything:   docker compose up -d --build --wait
#               (--wait returns once every health check passes, so the system is really ready)
#
# The Postgres user and password ("shop") are throwaway local-development values.
# .gitleaks.toml allowlists exactly these, so a real secret would still be caught.

# Shared settings for the four app services (a YAML anchor, merged in with `<<: *service`).
x-service: &service
  restart: unless-stopped
  depends_on:
    redpanda: { condition: service_healthy }
    postgres: { condition: service_healthy }

# Shared health check timing. Each service adds its own `test` with its own port.
# start_period gives Node time to boot before failures count; retries x interval bounds the wait.
x-healthcheck: &healthcheck
  interval: 5s
  timeout: 3s
  retries: 30
  start_period: 10s

services:
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      # containers reach the broker as redpanda:9092, your laptop as localhost:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports: ['19092:19092']
    healthcheck:
      test: ['CMD-SHELL', "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 3s
      retries: 30

  redpanda-console:
    image: redpandadata/console:v2.7.2
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports: ['8080:8080']
    depends_on:
      redpanda: { condition: service_healthy }

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
    ports: ['5432:5432']
    volumes:
      - ./infra/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # Check over TCP, not the Unix socket. On first start the image runs init.sql on a
      # temporary server that only listens on the socket, so a socket check says "ready"
      # before the databases exist. order_query is the last database init.sql creates.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U shop -d order_query']
      interval: 3s
      retries: 30

  # Each service's health check calls GET /health, which runs SELECT 1 against its database.
  # node:22-alpine has no curl, but busybox provides wget.
  order-service:
    <<: *service
    build: { context: ., args: { SERVICE: order-service } }
    environment:
      PORT: '3001'
      KAFKA_BROKERS: 'redpanda:9092'
      DATABASE_URL: 'postgres://shop:shop@postgres:5432/orders'
    ports: ['3001:3001']
    healthcheck:
      <<: *healthcheck
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3001/health || exit 1']

  inventory-service:
    <<: *service
    build: { context: ., args: { SERVICE: inventory-service } }
    environment:
      PORT: '3002'
      KAFKA_BROKERS: 'redpanda:9092'
      DATABASE_URL: 'postgres://shop:shop@postgres:5432/inventory'
    ports: ['3002:3002']
    healthcheck:
      <<: *healthcheck
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3002/health || exit 1']

  payment-service:
    <<: *service
    build: { context: ., args: { SERVICE: payment-service } }
    environment:
      PORT: '3003'
      KAFKA_BROKERS: 'redpanda:9092'
      DATABASE_URL: 'postgres://shop:shop@postgres:5432/payments'
    ports: ['3003:3003']
    healthcheck:
      <<: *healthcheck
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3003/health || exit 1']

  order-query-service:
    <<: *service
    build: { context: ., args: { SERVICE: order-query-service } }
    environment:
      PORT: '3004'
      KAFKA_BROKERS: 'redpanda:9092'
      DATABASE_URL: 'postgres://shop:shop@postgres:5432/order_query'
    ports: ['3004:3004']
    healthcheck:
      <<: *healthcheck
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3004/health || exit 1']
